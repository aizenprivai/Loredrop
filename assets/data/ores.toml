# Ore and rock-blob distribution, modelled on modern Minecraft's (1.18+) depths.
#
#   block      block placed in stone
#   deepslate  variant placed when the host rock is deepslate (optional)
#   size       approximate blocks per vein
#   per_chunk  vein attempts per chunk (fractions allowed: 0.5 = every other chunk)
#   height     [min, max] Y range
#   shape      "uniform"  — equally likely anywhere in the range
#              "triangle" — most common at the middle of the range, fading to the ends
#   biomes     optional list: only generate in these biomes
#
# Note: Minecraft's "redstone" is intentionally absent — it's a Minecraft-specific
# invention; Loredrop's equivalent (if any) is an open design item (GDD §16).

# Rock variety blobs
