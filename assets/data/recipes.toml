# Loredrop recipes — modelled on Minecraft's so progression feels the same.
#
# [tags]      named groups of items; use them in recipes as "#name".
# [[shaped]]  pattern rows (1–3 rows of 1–3 characters; space = empty) and a
#             key mapping characters to items or #tags. Patterns also match
#             their mirror image, like in Minecraft.
# [[shapeless]] a list of ingredients in any arrangement.
# [[smelting]] furnace recipes: input → result, `time` in ticks (20 = 1 s).
# [fuels]     furnace fuel burn times in ticks (an item smelts in 200 ticks).

[tags]
planks = ["oak_planks", "birch_planks", "spruce_planks"]
logs = ["oak_log", "birch_log", "spruce_log"]
stone_tool_materials = ["cobblestone"]
coals = ["coal", "charcoal"]

# --- Basics -----------------------------------------------------------------
[[shapeless]]
result = "oak_planks"
count = 4
ingredients = ["oak_log"]

[[shapeless]]
result = "birch_planks"
count = 4
ingredients = ["birch_log"]

[[shapeless]]
result = "spruce_planks"
count = 4
ingredients = ["spruce_log"]

[[shaped]]
result = "stick"
count = 4
pattern = ["P", "P"]
key = { P = "#planks" }

[[shaped]]
result = "torch"
count = 4
pattern = ["C", "|"]
key = { C = "#coals", "|" = "stick" }

[[shaped]]
result = "crafting_table"
pattern = ["PP", "PP"]
key = { P = "#planks" }

[[shaped]]
result = "furnace"
pattern = ["CCC", "C C", "CCC"]
key = { C = "#stone_tool_materials" }

# --- Building blocks ----------------------------------------------------------
