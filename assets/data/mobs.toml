# Loredrop creatures.
#
#   name, display      stable ID / shown name
#   category           passive | hostile | neutral (fights only when provoked)
#   health             hit points (2 = one heart)
#   speed              movement speed (Minecraft-style attribute; player walking ≈ 0.1 accel)
#   width, height      hitbox in blocks
#   attack_damage      melee damage on Normal difficulty (Easy ×0.5+1, Hard ×1.5)
#   ranged             true: shoots arrows instead of melee (skeleton-style)
#   burns_in_daylight  catches fire under open sky during the day (zombie, skeleton)
#   calm_in_light      won't attack in bright light (level 12+) unless hurt first (spider)
#   drops              "item", "item:min-max" or "item@chance", rolled on death
#   carries            neutral block-movers only: block names it picks up and places
#   angry_speed        neutral only: speed multiplier while provoked (default 1.0)
#   spawn              where it appears:
#                        surface = grassy biomes (list) when a chunk is first generated
#                        dark    = places without sky access (caves) near the player
#                      group = [min, max] creatures per spawn, weight = relative frequency
#
# Models are made of boxes measured in PIXELS (16 = one block):
#   box   = [x, y, z, width, height, depth] — x across, y up from the feet, z forward
#   pivot = [x, y, z] point the part rotates around (hips, shoulders, neck)
#   rot   = [x, y, z] fixed rotation in degrees (e.g. zombie arms held forward)
#   role  = head | leg | arm | wing | none — how the part animates
#   phase = 0 or 1: which half of the walk cycle a leg/arm swings in
#   tex   = texture for all faces (assets/textures/entity/), front = texture for the +z face

# ---------------------------------------------------------------- passive ----
[[mob]]
name = "cow"
display = "Cow"
category = "passive"
health = 10
speed = 0.2
width = 0.9
height = 1.4
drops = ["beef:1-3", "leather:0-2"]
spawn = { surface = ["plains", "forest", "birch_forest", "taiga", "mountains"], group = [2, 4], weight = 8 }
parts = [
  { name = "body", box = [-6, 12, -9, 12, 10, 18], tex = "cow_body" },
  { name = "head", box = [-4, 16, 9, 8, 8, 6], pivot = [0, 20, 9], role = "head", tex = "cow_head", front = "cow_face" },
  { name = "leg_bl", box = [-6, 0, -9, 4, 12, 4], pivot = [-4, 12, -7], role = "leg", phase = 0, tex = "cow_leg" },
  { name = "leg_br", box = [2, 0, -9, 4, 12, 4], pivot = [4, 12, -7], role = "leg", phase = 1, tex = "cow_leg" },
  { name = "leg_fl", box = [-6, 0, 5, 4, 12, 4], pivot = [-4, 12, 7], role = "leg", phase = 1, tex = "cow_leg" },
  { name = "leg_fr", box = [2, 0, 5, 4, 12, 4], pivot = [4, 12, 7], role = "leg", phase = 0, tex = "cow_leg" },
]

