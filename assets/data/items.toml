# Loredrop items (besides blocks — every placeable block is automatically an item).
#
#   name, display   stable ID / shown name
#   max_stack       how many fit in one slot (default 64; tools are always 1)
#   texture         sprite in assets/textures/item/ (default: same as name)
#   tool, tier      makes it a tool: tool = pickaxe | axe | shovel | hoe | sword
#   attack_damage   damage dealt (used from Phase 6), attack_speed hits/second
#   armor           makes it wearable: helmet | chestplate | leggings | boots,
#                   with `defense` points, `toughness` and `durability`
#   food, saturation  makes it edible: hunger points restored and saturation
#                   modifier (Minecraft values; saturation gained = food × modifier × 2)
#
# Tier numbers follow Minecraft's so mining and progression feel the same.
# `level` decides which blocks a tool can harvest (0 wood/gold, 1 stone, 2 iron, 3 diamond).

[tiers.wooden]
level = 0
speed = 2.0
durability = 59

[tiers.stone]
level = 1
speed = 4.0
durability = 131

[tiers.iron]
level = 2
speed = 6.0
durability = 250

[tiers.golden]
level = 0
speed = 12.0
durability = 32

[tiers.diamond]
level = 3
speed = 8.0
durability = 1561

