# Loredrop biome definitions (core set, GDD §3.3).
#
# Climate ranges (each roughly -1..1) — see ld_world/src/biome.rs for details:
#   temperature      cold ↔ hot          humidity   dry ↔ wet
#   continentalness  ocean ↔ inland      erosion    mountainous ↔ flat
#   weirdness        values near 0 = river valleys
# A spot gets the biome whose ranges it's closest to; on ties, the one listed
# FIRST wins — so special biomes (river, beach, mountains) come first.
#
# Colours tint grey textures (grass tops, plants, leaves, water).
# surface/filler/underwater are block names from blocks.toml.
# trees: weights of tree kinds (oak, birch, spruce, cactus); tree_density = trees per chunk.
# plants: block name → placement attempts per chunk.

[[biome]]
name = "deep_ocean"
display = "Deep Ocean"
continentalness = [-2.0, -0.455]
grass_color = "#8EB971"
foliage_color = "#71A74D"
water_color = "#3D57D6"
surface = "gravel"
filler = "gravel"
underwater = "gravel"

[[biome]]
name = "ocean"
display = "Ocean"
continentalness = [-0.455, -0.19]
grass_color = "#8EB971"
foliage_color = "#71A74D"
water_color = "#3F76E4"
surface = "sand"
filler = "sand"
underwater = "sand"

[[biome]]
name = "river"
display = "River"
continentalness = [-0.11, 2.0]
erosion = [-0.2, 2.0]
weirdness = [-0.04, 0.04]
grass_color = "#8DB960"
foliage_color = "#71A74D"
water_color = "#3F76E4"
surface = "sand"
filler = "dirt"
underwater = "sand"

[[biome]]
