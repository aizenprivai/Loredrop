# Loredrop block definitions.
#
# Each [[block]] entry defines one block type. Fields:
#   name      stable ID used in saves and commands. NEVER rename a block.
#   display   name shown to players (defaults to `name`).
#   layer     opaque      — solid, hides what's behind it
#             cutout      — pixels fully visible or fully see-through (leaves, glass)
#             translucent — partly see-through (water); not drawn yet
#             invisible   — never drawn
#   solid     whether players/creatures collide with it (default: true unless invisible)
#   cull_same hide faces between two blocks of this type (glass: yes; leaves: no)
#   textures  texture per face. Keys: all, side, top, bottom, north, south, east, west
#             (more specific keys win). Names are files in assets/textures/block/
#             and match Minecraft Java resource-pack names, so packs can replace them.
#   tint      faces coloured by the biome: "grass", "foliage" or "water".
#   shape     "cube" (default) or "cross" (plants)
#   hardness  seconds-ish to mine by hand (Minecraft scale); -1 = unbreakable; 0 = instant
#   tool      the tool that mines it fast: pickaxe | axe | shovel | hoe
#   harvest_level  if set, the block only DROPS when mined with `tool` of at least
#             this tier level (0 wood/gold, 1 stone, 2 iron, 3 diamond)
#   drops     what breaking it gives (default: itself). "none", "item", "item:2-5"
#             (random count) or "item@0.02" (2 % chance); several drops are
#             separated by commas, e.g. "stick@0.02, apple@0.005"
#   light     light the block gives off, 0–15 (lava 15, torch 14, lit furnace 13)
#   light_filter  how much light passing through is dimmed, 0–15. Default: 15 for
#             opaque cubes (blocks light), 0 otherwise. Leaves and water use 1.
#
# `air` is built in and must not be listed.

[[block]]
name = "stone"
hardness = 1.5
tool = "pickaxe"
harvest_level = 0
drops = "cobblestone"
display = "Stone"
layer = "opaque"
textures = { all = "stone" }

